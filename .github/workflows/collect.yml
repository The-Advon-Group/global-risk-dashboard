# Phase 1 workflow: manual runs only.
#
# The scheduled cadence, the keepalive against GitHub's 60-day disable rule, and
# the external staleness check are Phase 4 and are deliberately NOT wired up
# here yet - a schedule that starts running before the anonymity setup is done
# would bake the wrong commit identity into the history.
#
# Before the first run, read the "Anonymity" section of the README. The account,
# the organisation and the git identity all need to be the project identity from
# the very first commit.

name: Collect advisories

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (ca,uk,us,fr,jp)"
        default: "ca,uk,us,fr"
      dry_run:
        description: "Collect and report without writing a snapshot"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Every suite, not just the pipeline one. The mojibake that reached the
      # repo on 10 Sep was caught by test_pipeline.py purely by luck of which
      # file it lived in; a suite that does not run cannot catch anything.
      - name: Run offline tests
        run: |
          set -e
          for f in test_*.py; do
            echo "== $f"
            python "$f"
          done

      - name: Collect
        run: |
          set -o pipefail
          python pipeline.py \
            --sources "${{ inputs.sources }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee run-report.txt

      # The log viewer virtualises long output and will not hand back the whole
      # step, so the report also leaves as a file you can just open.
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run-report.txt
          retention-days: 30

      # A dry run builds the whole snapshot and commits none of it. Uploading it
      # here means the page can be built and checked against real data without
      # anything being published.
      - name: Upload dry-run snapshot
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: run-snapshot
          path: run-snapshot.json
          retention-days: 7

      - name: Commit snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "${{ vars.COMMIT_NAME  || 'risk-dashboard-bot' }}"
          git config user.email "${{ vars.COMMIT_EMAIL || 'bot@users.noreply.github.com' }}"
          git add data snapshots
          git diff --staged --quiet || git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
